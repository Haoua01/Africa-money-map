<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Africa Money Map</title>
        <!-- Load Bootstrap first -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Bootstrap Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Leaflet CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
        
        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

        <!-- Load your custom styles after -->
        <link rel="stylesheet" href="assets/styles.css">

        <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

        <link rel="stylesheet" href="assets/Control.FullScreen.css" />
        <script src="assets/Control.FullScreen.js"></script>



    </head>
    
<body>
    <header>
        Africa Money Map
    </header>


    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="sidebar-btn" id="map-btn">Map</button>
            
            <!--
            <label for="department-select">Equipment type for Map:</label>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="equipmentDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Select equipment
                </button>
                <ul class="dropdown-menu" id="equipment-select">
                    <li><a class="dropdown-item" href="#" data-value="nearest_ATM">ATM</a></li>
                    <li><a class="dropdown-item" href="#" data-value="isibf_base">Bank Branch</a></li>
                </ul>
            </div>
             -->


            <label for="country-select">Country:</label>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="countryDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Select country
                </button>
                <ul class="dropdown-menu w-100" id="country-select"></ul>
            </div>


            <label for="region-select">ADM1:</label>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="regionDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Default
                </button>
                <ul class="dropdown-menu w-100" id="region-select"></ul>
            </div>

            <label for="department-select">ADM2:</label>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="departmentDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Default
                </button>
                <ul class="dropdown-menu w-100" id="department-select"></ul>
            </div>


            <label for="commune-select">ADM3:</label>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="communeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Default
                </button>
                <ul class="dropdown-menu w-100" id="commune-select"></ul>
            </div>
            

            <button id="resetButton">Reset</button>
            
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="map-content">
                <h1>
                    Spatial Access to Bank Branches
                </h1>
                <div class="stats-container">
                    <div class="stat-box" id="num-municipalities"></div>
                    <div class="stat-box" id="total-bran"></div>
                    <div class="stat-box" id="percent-pop"></div>
                    <div class="stat-box" id="percent-area"></div>
                </div>
                <div id="map">
                    <div class="toggle-container">
                    <label class="switch">
                        <input type="checkbox" id="isochrone-toggle">
                        <span class="slider round"></span>
                    </label>
                    <label for="isochrone-toggle">Show Isochrones</label>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-fullscreen/2.0.0/leaflet.fullscreen.min.js"></script>

    
</body>
</html>
